# ---------------------------------------------------------------------------
# Sentinel credential policy -- DATA, not code.
#
# Sentinel requires no API keys, no accounts, and no signup. This file is the
# machine-readable statement of that property, and the enforcement module
# (sentinel/credguard.py) is deliberately pattern-agnostic: it loads this file
# rather than embedding the denylist in source.
#
# Why that split matters: the project's CI gate greps the `sentinel/` package
# for credential-shaped identifiers and requires zero matches. A module that
# hardcoded the denylist would match its own gate, and the usual workaround
# (splitting string literals so the grep misses them) is precisely the kind of
# self-defeating check an auditor should reject. Keeping the patterns in data
# makes the package genuinely clean, and makes the policy reviewable and
# extensible without a code change.
# ---------------------------------------------------------------------------

version: 1

# Environment variable names matching any of these regexes (case-insensitive)
# must never be read from inside the `sentinel` package. Reads are attributed
# by caller frame, so a match raises only when Sentinel's own code is the
# reader -- see `allowed_external_readers` for why that distinction exists.
forbidden_env_patterns:
  - "TOKEN"
  - "KEY"
  - "SECRET"
  - "PASSWORD"
  - "PASSWD"
  - "CREDENTIAL"
  - "APIKEY"
  - "SESSION_ID"

# Variables Sentinel is explicitly permitted to read even if a pattern above
# would otherwise match. Each entry needs a stated reason; none of these carry
# authentication material.
allowed_env_reads:
  # Optional salt that pseudonymises target addresses in the structured log.
  # Not a credential: it protects the subjects of the study, and a study whose
  # logs never leave the lab can omit it entirely.
  - SENTINEL_TARGET_SALT

# Modules outside the `sentinel` package legitimately read policy-matching
# variables as part of ordinary platform behaviour. The stdlib `ssl` module
# reads SSLKEYLOGFILE on every default context creation, so a guard that fired
# on the *variable* rather than on the *reader* would break TLS entirely. These
# prefixes are therefore never blocked.
allowed_external_readers:
  - ssl
  - urllib
  - urllib3
  - requests
  - aiohttp
  - subprocess
  - multiprocessing
  - asyncio
  - http
  - socket
  - encodings
  - _pytest
  - pytest
  - site
  - sysconfig

# Substrings that must not appear in the `sentinel/` package source. This is the
# programmatic form of the CI grep gate; `tests/test_credguard.py` asserts it
# and `scripts/check_no_credentials.sh` runs the shell equivalent.
forbidden_source_patterns:
  - "token"
  - "api_key"
  - "apikey"
  - "secret"
  - "bearer"
  - "authorization:"

# Paths excluded from the source scan: documentation (which must be free to
# discuss the policy in prose) and this file.
source_scan_excludes:
  - "docs/"
  - "credential_policy.yaml"
  - "__pycache__/"

# Every network endpoint Sentinel may contact, with the authentication each
# requires. `auth: none` is the only permitted value; CREDENTIALS.md renders
# this list, and tests assert the code contacts nothing outside it.
allowed_endpoints:
  - host: stat.ripe.net
    purpose: "ASN -> announced prefixes, network-info, AS overview"
    auth: none
  - host: internetdb.shodan.io
    purpose: "Per-IP open ports, tags, CPEs, CVE references (free, keyless)"
    auth: none
  - host: ftp.ripe.net
    purpose: "RIR delegated-extended file (country / RIR / allocation status)"
    auth: none
  - host: ftp.arin.net
    purpose: "RIR delegated-extended file"
    auth: none
  - host: ftp.apnic.net
    purpose: "RIR delegated-extended file"
    auth: none
  - host: ftp.lacnic.net
    purpose: "RIR delegated-extended file"
    auth: none
  - host: ftp.afrinic.net
    purpose: "RIR delegated-extended file"
    auth: none
  - host: rdap.db.ripe.net
    purpose: "RDAP IP object lookup (org name) -- anonymous, keyless"
    auth: none
  - host: rdap.arin.net
    purpose: "RDAP IP object lookup (org name) -- anonymous, keyless"
    auth: none
  - host: rdap.apnic.net
    purpose: "RDAP IP object lookup (org name) -- anonymous, keyless"
    auth: none
  - host: rdap.lacnic.net
    purpose: "RDAP IP object lookup (org name) -- anonymous, keyless"
    auth: none
  - host: rdap.afrinic.net
    purpose: "RDAP IP object lookup (org name) -- anonymous, keyless"
    auth: none

# Services that must never be referenced, even behind an optional flag. Each
# requires an account, a key, or a registered tier.
denied_services:
  - ipinfo.io
  - api.shodan.io
  - search.censys.io
  - fofa.info
  - zoomeye.org
  - api.binaryedge.io
  - api.greynoise.io
  - virustotal.com
  - abuseipdb.com
