  - vendor: Generic Industrial Protocol Port
    generic: true
    ports: [102, 502, 1911, 2222, 4840, 20000, 44818, 47808]
    server_header: []
    title_keywords: []
    js_globals: []
    url_patterns: []
    default_cred_risk: false
    cves: []
