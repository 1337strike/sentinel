      - "ModiconWeb"
      - "SchneiderWebDesigner"
    url_patterns:
      - "/FactoryCast"
      - "/secure/embedded/default.htm"
      - "/rde"
      - "/ws/rpc"
    default_cred_risk: true
    cves:
      - "CVE-2018-7811"
      - "CVE-2021-22779"
    mitre_ics:
      - "T0883"
      - "T0855"
      - "T0836"
      - "T0869"
    notes: >
      Modicon M-series PLCs with the FactoryCast embedded web server. Modbus/TCP
      on 502 has no authentication or integrity protection by design, so
      Internet exposure of that port is equivalent to unauthenticated process
      control.

  # =========================================================================
  # Protocol-level and framework indicators
  # =========================================================================

  - vendor: CODESYS WebVisu
    ports: [8080, 80, 443, 1217, 11740]
    server_header:
      - "codesys"
      - "3s-smart"
    title_keywords:
      - "codesys"
      - "webvisu"
      - "visualization"
    js_globals:
      - "webvisu"
      - "CODESYS"
      - "WebVisuServlet"
    url_patterns:
      - "/webvisu.htm"
      - "/plc/webvisu.htm"
      - "/webvisu/visu"
    default_cred_risk: true
    cves: []
    mitre_ics:
      - "T0883"
      - "T0831"
      - "T0836"
    notes: >
      CODESYS runtime WebVisu. Vendor-neutral: dozens of OEMs ship it, so a
      WebVisu match identifies the runtime rather than the hardware vendor. The
      visualisation itself routinely exposes live process graphics without
      authentication.

  - vendor: OPC-UA Endpoint
    ports: [4840, 4843, 48010, 53530]
    server_header: []
    title_keywords:
      - "opc ua"
      - "opc-ua"
      - "opcua server"
    js_globals: []
    url_patterns: []
    default_cred_risk: false
    cves: []
    mitre_ics:
      - "T0883"
      - "T0869"
      - "T0861"
    notes: >
      OPC-UA binary endpoint. Sentinel sends no OPC-UA Hello message, so this
      entry matches only on port affinity plus any volunteered banner; treat it
      as a candidate. Anonymous OPC-UA sessions, where permitted by the server,
      allow full address-space browsing -- but confirming that would require a
      protocol handshake, which this methodology excludes.

