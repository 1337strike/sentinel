      - "T0822"
      - "T0861"
      - "T0802"   # Automated Collection
    notes: >
      Ignition gateway. The status endpoint commonly reveals gateway name,
      version, edition, and project list without authentication, which is enough
      to plan an attack path even when the project itself is protected.

