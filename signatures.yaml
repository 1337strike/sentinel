    notes: >
      FactoryTalk View SE/ME and associated Rockwell components. EtherNet/IP on
      TCP/44818 and UDP/2222 frequently accompanies the web interface; the
      combination is a strong indicator even when the web layer is generic.

  - vendor: Citect
    ports: [80, 443, 8080, 2082, 20000]
    server_header:
