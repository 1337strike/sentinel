      - "T0822"
      - "T0861"
    notes: >
      Experion PKS operator interfaces and Honeywell building controllers. Some
      building products embed the Niagara framework, so a Niagara indicator does
      not exclude a Honeywell asset -- expect legitimate overlap between these
      two signatures and treat the runner-up match as meaningful.

  # =========================================================================
  # Controller / PLC families (identified via embedded web UI only)
  # =========================================================================

  - vendor: Siemens S7
    ports: [102, 80, 443, 8080, 161]
    server_header:
      - "simatic"
      - "siemens"
      - "s7-"
      - "goahead-webs"      # weak alone; common on SIMATIC CPs
    tls_subject_keywords:
      - "siemens"
      - "simatic"
    title_keywords:
      - "simatic"
      - "siemens"
      - "s7-1200"
      - "s7-1500"
      - "s7-300"
      - "s7-400"
      - "cp 343"
      - "web server simatic"
      - "wincc"
    js_globals:
      - "SimaticWebApp"
      - "s7WebServer"
      - "MiniWebLib"
    url_patterns:
      - "/Portal/Portal.mwsl"
      - "/basic/index.html"
      - "/awp"
      - "/FileBrowser"
      - "/DataLogs"
    default_cred_risk: true
    cves:
      - "CVE-2016-9158"
      - "CVE-2019-6568"
      - "CVE-2019-10923"
    mitre_ics:
      - "T0883"
      - "T0869"   # Standard Application Layer Protocol
      - "T0846"   # Remote System Discovery
      - "T0845"
    notes: >
      S7-1200/1500 CPUs expose a web server whose Portal.mwsl endpoint reveals
      station name, module type and firmware. ISO-TSAP on TCP/102 is the control
      protocol. NOTE: Sentinel never sends an S7 COTP/TPKT frame, so a TCP/102
      finding is "a service is listening on the S7 port" and not a confirmed S7
      CPU -- see docs/ARCHITECTURE.md on the zero-payload constraint.

  - vendor: Schneider Modicon
    ports: [80, 443, 502, 8080]
    server_header:
      - "schneider"
      - "modicon"
      - "basic/web"
      - "schneider-electric"
    tls_subject_keywords:
      - "schneider"
      - "modicon"
    title_keywords:
      - "schneider electric"
      - "modicon"
      - "m221"
      - "m241"
      - "m251"
      - "m340"
      - "m580"
      - "bmx"
      - "web designer"
      - "factorycast"
    js_globals:
