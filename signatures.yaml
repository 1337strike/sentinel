# ===========================================================================
# Sentinel ICS/SCADA fingerprint database
# ===========================================================================
#
# SCHEMA (per entry)
#   vendor                 str   Product/family label reported in output.
#   ports                  [int] Ports the product is conventionally served on.
#                                Port affinity alone NEVER identifies a product;
#                                it only reinforces a content-layer match.
#   server_header          [str] Substrings matched case-insensitively against
#                                the HTTP `Server` response header.      (L1)
#   tls_subject_keywords   [str] Substrings matched against the TLS certificate
#                                subject and issuer DN.                   (L2)
#   title_keywords         [str] Substrings matched against <title>.       (L3)
#   js_globals             [str] Case-SENSITIVE substrings matched against the
#                                response body; JavaScript identifiers are
#                                case-significant.                        (L4)
#   url_patterns           [str] Product-specific paths. Probed with GET only.  (L5)
#   default_cred_risk      bool  Product family is documented as shipping
#                                default credentials. Sentinel NEVER tests them;
#                                this only raises the remediation priority.
#   cves                   [str] Indicative CVE references -- see caveat below.
#   mitre_ics              [str] MITRE ATT&CK for ICS technique IDs that
#                                Internet exposure of this asset enables.
#   generic                bool  Entry matches industrial *vocabulary* rather
#                                than a product. Can never yield a confirmed-ICS
#                                verdict; caps at MEDIUM risk.
#   notes                  str   Analyst context.
#
# ---------------------------------------------------------------------------
# CAVEAT ON CVE REFERENCES  (important for anyone citing this file)
# ---------------------------------------------------------------------------
# The `cves` lists are TRIAGE POINTERS, not version-matched vulnerability
# assertions. Sentinel does not read firmware versions, does not authenticate,
# and does not probe for vulnerable behaviour -- so it cannot and does not claim
# that a matched host is affected by a listed CVE. The lists answer "what has
# historically been reported against this product family, so an analyst knows
# where to look", and `modules/risk.py` phrases the remediation accordingly.
#
# Entries are left EMPTY where no well-established public reference was
# confidently available, rather than being filled speculatively. An empty list
# means "not populated", never "no known issues". Verify every reference against
# the vendor advisory and the CISA ICS advisory database before citing it in a
# report or a paper.
# ---------------------------------------------------------------------------

version: 1

matching:
  # Layer weights. Normalised by their sum, so these are relative importances
  # rather than absolute scores. The `Server` header is weighted highest because
  # embedded industrial HTTP stacks rarely disguise it; port affinity is weighted
  # lowest because it is the weakest possible evidence.
  weights:
    server_header: 0.35
    tls_subject: 0.15
    title: 0.25
    js_globals: 0.15
    url_pattern: 0.15
    port_affinity: 0.05

  # Score at or above which a non-generic match counts as CONFIRMED ICS.
  # Experiment E1 sweeps this value to produce the detection ROC curve; the
  # default is the operating point reported in the paper.
  confirm_threshold: 0.45

  # Score at or above which a generic/weak match counts as industrial
  # vocabulary (MEDIUM risk, "candidate" rather than "confirmed").
  generic_threshold: 0.20

signatures:

  # =========================================================================
  # Building management / energy data controllers
  # =========================================================================

  - vendor: REDY-Process
    ports: [9000, 80, 8080]
    server_header:
      - "redy"
      - "lighttpd/1.4"      # weak alone; combines with title/JS layers
    title_keywords:
      - "redy"
      - "redy-process"
      - "energiemanagement"
      - "energy monitoring"
    js_globals:
      - "redyApp"
      - "REDY_CONFIG"
      - "redyProcess"
    url_patterns:
      - "/redy"
      - "/cgi-bin/redy"
      - "/process/overview"
      - "/api/datapoints"
    default_cred_risk: true
    cves: []
    mitre_ics:
      - "T0883"   # Internet Accessible Device
      - "T0861"   # Point & Tag Identification
      - "T0801"   # Monitor Process State
    notes: >
      Building-management and energy-data acquisition controller with a web UI
      conventionally on TCP/9000. Datapoint endpoints frequently enumerate tag
      names and live process values before any authentication, which is the
      canonical pre-authentication disclosure case this tool was built to find.

  - vendor: Niagara/Tridium
    ports: [80, 443, 1911, 4911, 8080, 8443]
    server_header:
      - "niagara"
      - "niagara web server"
    tls_subject_keywords:
      - "niagara"
      - "tridium"
    title_keywords:
      - "niagara"
      - "tridium"
      - "station"
      - "jace"
      - "workbench"
    js_globals:
      - "niagaraVersion"
      - "BajaScript"
      - "bajaux"
      - "NiagaraSystem"
    url_patterns:
      - "/login"
      - "/ord"
      - "/prelogin"
      - "/niagara"
      - "/wb"
    default_cred_risk: true
    cves:
      - "CVE-2012-4701"
      - "CVE-2017-16744"
    mitre_ics:
      - "T0883"
      - "T0822"   # External Remote Services
      - "T0861"
      - "T0831"   # Manipulation of Control
    notes: >
      Niagara Framework controllers (JACE hardware and software stations). Fox
      protocol on TCP/1911 and 4911; web UI on 80/443/8080/8443. The /prelogin
      endpoint has historically disclosed station identity and version before
      authentication.

