      - "/plc/webvisu.htm"
    default_cred_risk: true
    cves: []
    mitre_ics:
      - "T0883"
      - "T0822"
      - "T0831"
    notes: >
      ABB automation web interfaces (800xA operator clients, AC500 PLC web
      server, building-automation controllers). AC500 commonly serves a CODESYS
