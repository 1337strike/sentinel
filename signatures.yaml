  - vendor: Honeywell
    ports: [80, 443, 8080, 8443, 502]
    server_header:
      - "honeywell"
      - "experion"
      - "tridium"          # Honeywell building controllers embed Niagara
    tls_subject_keywords:
      - "honeywell"
    title_keywords:
      - "honeywell"
      - "experion"
      - "spyder"
      - "webvision"
      - "comfortpoint"
      - "niagara"
    js_globals:
      - "HoneywellWeb"
